[project]
name = "kicad-python"
version = "0.8.0.dev0"
description = "KiCad API Python Bindings"
authors = [{ name = "The KiCad Development Team" }]
license = "MIT"
readme = "README.md"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Typing :: Typed",
]
requires-python = ">=3.9"
dependencies = [
    "protobuf>=6.33.6",
    "pynng>=0.9.0,<0.10.0",
    "jsonschema>=4.23.0,<5",
    # 3.10: TypeAlias, Never (mypy-protobuf generated code)
    # 3.11: Self
    # 3.13: @deprecated
    "typing-extensions>=4.13.2",
]

[project.scripts]
kicad-python-packager = "kipy.packaging.cli:main"

[project.urls]
homepage = "https://kicad.org/"
documentation = "https://docs.kicad.org/kicad-python-main/"
repository = "https://gitlab.com/kicad/code/kicad-python"
issues = "https://gitlab.com/kicad/code/kicad-python/-/issues"

[dependency-groups]
dev = [
    "furo>=2025.12.19",
    "grpcio-tools>=1.80.0",
    "hatchling>=1.27.0",
    "mypy>=1.19.1",
    "mypy-protobuf>=5.1.0",
    "pytest>=8.4.2",
    "ruff>=0.15.12",
    "sphinx>=7.4.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["kipy"]

[tool.hatch.build.targets.wheel]
packages = ["kipy"]
artifacts = ["kipy/proto/**/*_pb2.py*", "kipy/kicad_api_version.py"]

[tool.hatch.build.hooks.custom]
dependencies = ["grpcio-tools", "mypy-protobuf"]
proto_path = "kicad/api/proto"
output_path = "kipy/proto"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "hatch_build.py" },
    { file = "kicad/api/proto/**/*.proto" },
    { file = "kipy/proto/**/*_pb2.py*" },
    { file = "kipy/kicad_api_version.py" },
]
